<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor Universal | Design Moderno</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <button class="dark-toggle" onclick="document.body.classList.toggle('dark-mode')">
      <i class="fa-solid fa-circle-half-stroke"></i> Alternar Modo Escuro
    </button>

    <div class="converter-app">
      <div class="app-background"></div>

      <header class="app-header">
        <h1><i class="fa-solid fa-right-left"></i> Conversor Universal</h1>
        <p>Converta unidades em tempo real entre várias categorias</p>
      </header>

      <nav class="category-nav" id="categoryNav"><!-- botões gerados via JS --></nav>

      <section class="conversion-section">
        <div class="conversion-row">
          <div class="field">
            <label for="inputValue">De</label>
            <input type="number" id="inputValue" value="1" inputmode="decimal" />
            <select id="fromUnit"></select>
          </div>

          <button class="swap-btn" id="swapBtn" title="Inverter unidades" aria-label="Inverter unidades">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
          </button>

          <div class="field">
            <label for="outputValue">Para</label>
            <input type="text" id="outputValue" readonly />
            <select id="toUnit"></select>
          </div>
        </div>

        <div class="conversion-result" id="resultText">—</div>
      </section>

      <section class="history">
        <div class="history-header">
          <h3><i class="fa-solid fa-clock-rotate-left"></i> Histórico</h3>
          <button class="clear-history" id="clearHistory" title="Limpar histórico">
            <i class="fa-solid fa-trash"></i> Limpar
          </button>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </section>

      <footer class="app-footer">
        Feito com HTML, CSS e JavaScript • <span id="year"></span>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
